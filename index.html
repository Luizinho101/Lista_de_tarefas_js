<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    <header></header>
    <section>
        <main>
            <div>
                <label for="dataInicio">Data de Início</label>
                <input type="date" id="dataInicio">

                <label for="dataFim">Data Fim</label>
                <input type="date" id="dataFim">

                <label for="nometarefa">Tarefa</label>
                <input type="text" id="nometarefa" placeholder="Digite a tarefa...">

                <div>
                    <button type="button" id="cadastrar" onclick="criarTarefa()">Criar Tarefa</button>
                    <button type="button" id="excluir" onclick="excluirTarefa()">Excluir Tarefa</button>
                </div>
            </div>

            <div class="resp">
                <div id="resultado"></div> 
            </div>
        </main>
    </section>
    <footer></footer>
    <script src="src/js/script.js"></script>
</body>
</html>
